[project]
name = "argus"
description = "ARGUS — evidence-driven cyber investigation platform (production foundation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "TBD" }
dynamic = ["version"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
  "pydantic-settings>=2",
  "structlog>=26.1.0",
]

[dependency-groups]
# Single dev group: uv installs it by default, so `uv sync --frozen` alone
# provisions all lint/type/test tooling. No runtime deps here.
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",  # coverage gate (M0 spec §7.5)
  "httpx",  # required by FastAPI/Starlette TestClient
  "pre-commit>=4.6.2",  # fast commit-time hooks (M0 spec §8); dev-only, never in the image
  "pip-audit>=2.10.1",  # Python dependency vuln audit (M0 spec §11, Slice 9); dev-only, never in the image
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/argus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
# Spike is frozen, isolated, and has its own toolchain/Python (M0 spec §1.2).
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (S101).
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# Only our tests; spikes/ is frozen and isolated (M0 spec §1.2).
testpaths = ["tests"]
# The documented `pytest` invocation enforces the coverage gate (M0 spec §7.5,
# §10): measure the argus package, show missing lines, fail under 85%.
addopts = "--cov=argus --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# Measure production source only; spikes/ is excluded entirely (M0 spec §7.5).
source = ["argus"]
# main.py is the thin uvicorn entrypoint (`app = create_app()`); the factory it
# calls is covered via TestClient. Excluding the entrypoint is the one
# justified omission (M0 spec §7.5).
omit = ["*/argus/main.py"]

[tool.coverage.report]
show_missing = true
# Minimal, justified exclusions only — no blanket pragmas (M0 spec §7.5).
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
