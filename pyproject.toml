[project]
name = "argus"
description = "ARGUS — evidence-driven cyber investigation platform (production foundation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "TBD" }
dynamic = ["version"]
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
]

[dependency-groups]
# Single dev group: uv installs it by default, so `uv sync --frozen` alone
# provisions all lint/type/test tooling. No runtime deps here.
dev = [
  "ruff",
  "mypy",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/argus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
# Spike is frozen, isolated, and has its own toolchain/Python (M0 spec §1.2).
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use `assert` (S101).
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# Only our tests; spikes/ is frozen and isolated (M0 spec §1.2).
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
